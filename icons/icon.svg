<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Full-bleed background; the barbell stays inside the central safe zone so Android's
       circle/squircle masks and iOS's rounded corners never clip it. -->
  <rect width="512" height="512" fill="#111418"/>
  <g fill="#4f9cf9">
    <rect x="72" y="244" width="368" height="24" rx="12"/>
    <rect x="136" y="156" width="40" height="200" rx="10"/>
    <rect x="336" y="156" width="40" height="200" rx="10"/>
    <rect x="104" y="188" width="24" height="136" rx="8"/>
    <rect x="384" y="188" width="24" height="136" rx="8"/>
  </g>
</svg>
